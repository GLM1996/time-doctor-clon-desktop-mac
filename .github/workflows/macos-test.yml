name: Generar instalador macOS de pruebas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VITE_API_URL: ${{ vars.MAC_PROTOTYPE_API_URL || 'https://backend.logyourtime.com/api' }}
      VITE_MAC_TEST_BUILD: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generar DMG y ZIP sin certificado Apple
        run: npx --no-install electron-builder --mac --publish never -c.mac.identity=- -c.mac.forceCodeSigning=false -c.mac.notarize=false
      - name: Comprobar instaladores Intel y Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          for arch in x64 arm64; do
            test -s "release/LogYourTime-${VERSION}-${arch}.dmg"
            test -s "release/LogYourTime-${VERSION}-${arch}.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: LogYourTime-macOS-pruebas
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  upload-r2:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LogYourTime-macOS-pruebas
          path: installers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente R2
        run: |
          python -m venv "$RUNNER_TEMP/r2-cli"
          "$RUNNER_TEMP/r2-cli/bin/pip" install awscli
          echo "$RUNNER_TEMP/r2-cli/bin" >> "$GITHUB_PATH"
      - name: Subir instaladores de pruebas
        shell: bash
        run: |
          set -euo pipefail
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            test -n "${!key}" || { echo "Falta configuración: $key"; exit 1; }
          done
          [[ "$R2_ENDPOINT" == https://* ]] || exit 1
          DEST="s3://${R2_BUCKET}/mac/testing/"
          aws s3 cp installers/ "${DEST}build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}/" --recursive --exclude '*' --include '*.dmg' --include '*.zip' --endpoint-url "$R2_ENDPOINT" --only-show-errors
          shopt -s nullglob
          for arch in arm64 x64; do
            files=(installers/*-"$arch".dmg)
            test "${#files[@]}" -eq 1
            aws s3 cp "${files[0]}" "${DEST}LogYourTime-${arch}.dmg" --endpoint-url "$R2_ENDPOINT" --cache-control 'no-store' --only-show-errors
          done
          echo '### Instaladores de pruebas' >> "$GITHUB_STEP_SUMMARY"
          echo '- Apple Silicon: https://downloads.logyourtime.com/mac/testing/LogYourTime-arm64.dmg' >> "$GITHUB_STEP_SUMMARY"
          echo '- Intel: https://downloads.logyourtime.com/mac/testing/LogYourTime-x64.dmg' >> "$GITHUB_STEP_SUMMARY"
